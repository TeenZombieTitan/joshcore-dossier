<script>
  (() => {
    /* A mistyped URL *inside* a server's dossier would otherwise offer to send
       you back to the public page rather than to the dossier you were reading. */
    const bundle = location.pathname.match(/^\/s\/[0-9a-f]{8,}\//);
    if (bundle) {
      const back = document.getElementById("backToIndex");
      if (back) back.setAttribute("href", bundle[0]);
      return;
    }

    /* Everything about a person moved inside its own server's dossier when
       Blackbox went multi-server, so old bookmarks and old links posted in
       Discord all land here. Say where they went — naming no server, because
       this page is public. */
    if (!/^\/(u|board|people|titles|archive|gallery)(\/|$)/.test(location.pathname)) return;

    const note = document.createElement("div");
    note.className = "card";
    note.style.cssText = "margin:24px 0 0";
    note.innerHTML =
      '<strong>This page moved.</strong>' +
      '<p class="small dim" style="margin:8px 0 0">Every server now has its own ' +
      'private dossier, and profiles, standings and archives live inside it. ' +
      'Ask Blackbox for your server\'s link with <code>~site</code> in Discord ' +
      '— old addresses like this one no longer point anywhere.</p>';
    document.querySelector("section")?.append(note);
  })();
</script>
